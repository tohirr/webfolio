    <style>
      html {
        background: #0a0a0a;
      }
      /* match the light palette before the app mounts — no dark flash */
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) {
          background: #f6f6f4;
        }
      }
    </style>
    <script>
      /* restore a saved phosphor theme before first paint */
      try {
        var t = localStorage.getItem("wf-theme");
        if (t === "green" || t === "amber")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
